name: Buduj KeraBot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skonfiguruj Java 21 (Wymagana dla Gradle / Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Zainstaluj zaleznosci i wygeneruj natywny projekt Android
        run: |
          npm install --no-audit --no-fund
          npm run verify
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          node scripts/apply_native_bridge.js

      - name: Zbuduj uniwersalny plik APK ze stalym kluczem kerabot-fixed.p12
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Zweryfikuj certyfikat, wersję i udostępnianie przed publikacją
        shell: bash
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          echo "=== Rozmiar zbudowanego APK ==="
          ls -lh "$APK_FILE"
          echo "=== Weryfikacja certyfikatu podpisu APK (CN=KeraBot AI HUB, O=Seba) ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" | tee /tmp/apk_cert.txt
          grep -q "KeraBot AI HUB" /tmp/apk_cert.txt
          echo "=== Weryfikacja versionCode oraz ACTION_SEND w AndroidManifest skompilowanego APK ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK_FILE" > /tmp/apk_badging.txt
          sed -n '1,5p' /tmp/apk_badging.txt
          grep -Fq "versionCode='6'" /tmp/apk_badging.txt
          grep -Fq "versionName='0.4.0'" /tmp/apk_badging.txt
          "$AAPT2" dump xmltree "$APK_FILE" --file AndroidManifest.xml > /tmp/apk_manifest.txt
          grep -Fq '"android.intent.action.SEND"' /tmp/apk_manifest.txt
          grep -Fq '"android.intent.action.SEND_MULTIPLE"' /tmp/apk_manifest.txt

      - name: Przygotuj gotowe pliki KeraBot-Seba-latest.apk oraz wersjonowany APK
        run: |
          mkdir -p release_out
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk release_out/KeraBot-Seba-latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release_out/KeraBot-Seba-v${VER}.apk"

      - name: Zapisz APK jako artefakt GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KeraBot-Seba-APK
          path: release_out/*.apk
          if-no-files-found: error

      - name: Przesun tag latest na aktualny commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Opublikuj staly link do pobrania w GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "KeraBot AI HUB Android v0.4.0 (Inbox Zrzutów + Udostępnij z Galerii + Cloudflare Native)"
          body: "Zbudowana i zweryfikowana aplikacja Android v0.4.0 (buildCode=6, stały klucz PKCS12 CN=KeraBot AI HUB). Nowość: Udostępnij 1–10 zrzutów ekranu z Galerii telefonu prosto do Inboxa KeraBota, kategorie i podgląd pełnoekranowy (lupa), standard CSS Fold 7 oraz bezproblemowa aktualizacja na v0.3.0 bez odinstalowywania!"
          files: release_out/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Sprawdź oba pliki APK po publikacji
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p release_check
          for APK in KeraBot-Seba-latest.apk "KeraBot-Seba-v${VER}.apk"; do
            gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "$APK" --dir release_check
            cmp "release_out/$APK" "release_check/$APK"
          done
