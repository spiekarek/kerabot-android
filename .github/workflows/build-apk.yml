name: Buduj KeraBot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skonfiguruj Java 21 (Wymagana dla Gradle / Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Zainstaluj zaleznosci i wygeneruj natywny projekt Android
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then npx cap add android; fi
          node scripts/apply_native_bridge.js
          npx cap sync android

      - name: Zbuduj uniwersalny plik APK (Debug / Testowy)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Przygotuj gotowe pliki KeraBot-Seba-latest.apk oraz wersjonowany APK
        run: |
          mkdir -p release_out
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk release_out/KeraBot-Seba-latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release_out/KeraBot-Seba-v${VER}.apk"

      - name: Zapisz APK jako artefakt GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KeraBot-Seba-APK
          path: release_out/*.apk

      - name: Przesun tag latest na aktualny commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Opublikuj staly link do pobrania w GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "KeraBot AI HUB Android (Najnowsze APK)"
          body: "Automatycznie zbudowana uniwersalna aplikacja Android (Fold7, S24 Ultra, Vivo X300 Ultra i kazdy Android). Kliknij ponizej KeraBot-Seba-latest.apk aby pobrac na telefon."
          files: release_out/*.apk
          make_latest: true
