name: Próba kompilacji kolejki Android

on:
  pull_request:
    paths:
      - '.github/workflows/proba-kolejki-android.yml'
      - 'capacitor.config.json'
      - 'native_android/**'
      - 'scripts/apply_native_bridge.js'
      - 'tests/**'
      - 'package.json'
      - 'www/**'

permissions:
  contents: read

jobs:
  sprawdz-kompilacje:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - name: Pobierz kod testowany w PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Przygotuj odrębną aplikację testową
        run: |
          npm install --no-audit --no-fund
          npm run verify
          node --test tests/android-preview.cjs
          npx cap add android
          npm run cap:sync
          node scripts/apply_native_bridge.js --preview
          test ! -e android/app/kerabot-fixed.p12
      - name: Sprawdź kompilację Androida
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Sprawdź zapis i odtworzenie w emulatorze Android
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          image="system-images;android-34;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install platform-tools emulator "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/kerabot-android-home"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          printf "no\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name kolejka --package "$image" --path "$ANDROID_AVD_HOME/kolejka.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/kolejka.ini"
          "$ANDROID_HOME/emulator/emulator" -avd kolejka -port 5554 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/kerabot-emulator.log" 2>&1 &
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then tail -n 40 "$RUNNER_TEMP/kerabot-emulator.log"; fi; adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          adb shell input keyevent 82
          adb install -g android/app/build/outputs/apk/debug/app-debug.apk
          node tests/android-emulator.mjs
      - name: Dołącz przetestowany APK do odbioru na telefonie
        uses: actions/upload-artifact@v4
        with:
          name: KeraBot-kolejka-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
