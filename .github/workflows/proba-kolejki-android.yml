name: Próba kompilacji kolejki Android

on:
  pull_request:
    paths:
      - '.github/workflows/proba-kolejki-android.yml'
      - 'capacitor.config.json'
      - 'native_android/**'
      - 'scripts/apply_native_bridge.js'
      - 'tests/**'
      - 'package.json'
      - 'www/**'

permissions:
  contents: read

jobs:
  sprawdz-kompilacje:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Pobierz kod testowany w PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Przygotuj odrębną aplikację testową
        run: |
          npm install --no-audit --no-fund
          npm run verify
          node --test tests/android-preview.cjs
          npx cap add android
          npm run cap:sync
          node scripts/apply_native_bridge.js --preview
          test ! -e android/app/kerabot-fixed.p12
      - name: Sprawdź kompilację Androida
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
